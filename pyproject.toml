[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-lab-os"
version = "0.0.1"
description = "Evidence-aware multi-agent research orchestration MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.22,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["validation*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
